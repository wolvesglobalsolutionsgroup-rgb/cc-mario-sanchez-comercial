<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <base href="/gestion/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo — CC Mario Sánchez</title>
  <link rel="icon" type="image/x-icon" href="favicon_2k.ico?v=20260904">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_2k.png?v=20260904">
  <link rel="icon" type="image/svg+xml" href="logo_cc_mario_sanchez_2k.svg?v=20260904">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon_2k.png?v=20260904">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/theme-init.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: var(--bg-main);
      color: var(--txt-primary);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      box-shadow: var(--shadow-card);
      position: relative;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .login-card {
        padding: 24px 18px;
      }
    }
    .role-toggle {
      display: flex;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .role-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--txt-secondary);
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-btn.active {
      background: var(--amber);
      color: #000000;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }
    #login-submit-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
      width: 100% !important;
      padding: 13px !important;
    }
    #login-submit-btn span,
    #login-submit-text {
      display: inline !important;
      font-size: 13.5px !important;
      font-weight: 800 !important;
      letter-spacing: 0.3px !important;
    }
  </style>
</head>
<body>

<div class="login-card">

  <div style="text-align: center; margin-bottom: 24px;">
    <img src="logo_cc_mario_sanchez_2k.svg?v=20260904" alt="Logo" data-tenant-logo style="width: 72px; height: 72px; max-width: 72px; max-height: 72px; object-fit: contain; margin-bottom: 12px; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.6);">
    <h1 style="font-family: var(--font-heading); font-size: 22px; font-weight: 900; color: var(--txt-primary);" data-tenant-short>CC Mario Sánchez</h1>
    <p style="font-size: 12px; color: var(--amber-light); font-weight: 600; margin-top: 2px;">
      Plataforma de Gestión Inmobiliaria & Cobranzas
    </p>
  </div>

  <!-- SELECTOR DE ROL -->
  <div class="role-toggle">
    <button class="role-btn active" id="btn-role-admin" onclick="switchRole('admin')">
      <i class="fa-solid fa-user-shield"></i> Administrador
    </button>
    <button class="role-btn" id="btn-role-tenant" onclick="switchRole('tenant')">
      <i class="fa-solid fa-store"></i> Inquilino
    </button>
  </div>

  <form id="login-form" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 16px;">

    <div class="form-group">
      <label id="lbl-identifier">Correo Electrónico Administrador</label>
      <input type="text" class="form-control" id="login-user" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label>Contraseña de Seguridad</label>
      <input type="password" class="form-control" id="login-pass" autocomplete="current-password" required>
    </div>

    <div id="login-error" style="display:none;background:var(--rose-glow);border:1px solid var(--rose);color:var(--rose);border-radius:8px;padding:10px 12px;font-size:12px;font-weight:600;">
      <i class="fa-solid fa-triangle-exclamation"></i> <span id="login-error-msg"></span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11.5px;">
      <label style="color: var(--txt-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" id="remember-session" checked style="accent-color: var(--amber);"> Recordar sesión
      </label>
      <a href="#" style="color: var(--amber-light); text-decoration: none;" onclick="alert('Contacte al Administrador Principal para restablecer credenciales.');return false;">¿Olvidó su clave?</a>
    </div>

    <button type="submit" id="login-submit-btn" class="btn-onboarding-cta" style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px;">
      <i class="fa-solid fa-arrow-right-to-bracket"></i> <span id="login-submit-text">Ingresar al Portal</span>
    </button>

    <!-- CREDENCIALES DE DEMOSTRACIÓN (1-CLICK DEMO ACCESS) -->
    <div style="margin-top: 14px; background: var(--amber-glow); border: 1px dashed var(--border-highlight); border-radius: 8px; padding: 12px; font-size: 12px;">
      <div style="font-weight: 800; color: var(--amber); display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
        <i class="fa-solid fa-key"></i> <span>Credenciales Demo para Pruebas:</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button type="button" class="cur-pill active" id="btn-demo-admin" data-demo-login style="flex: 1; min-width: 90px; padding: 6px; font-size: 11px; text-align: center;" onclick="fillDemo('admin')">
          <i class="fa-solid fa-user-shield"></i> Demo Admin
        </button>
        <button type="button" class="cur-pill" id="btn-demo-tenant" data-demo-login style="flex: 1; min-width: 90px; padding: 6px; font-size: 11px; text-align: center;" onclick="fillDemo('tenant')">
          <i class="fa-solid fa-store"></i> Demo Inquilino
        </button>
        <button type="button" class="cur-pill" id="btn-demo-pending" data-demo-login style="flex: 1; min-width: 90px; padding: 6px; font-size: 11px; text-align: center; border-color: rgba(245, 158, 11, 0.4);" onclick="fillDemo('pending')" title="Probar bloqueo de cuenta pendiente de autorización por Comité">
          <i class="fa-solid fa-hourglass-half"></i> Demo Pendiente
        </button>
      </div>
    </div>
  </form>

  <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 11px; color: var(--txt-muted);">
    <div data-tenant-address>Av. Municipal, Puerto La Cruz, Venezuela</div>
    <div style="margin-top: 2px;">Sistema auditado conforme a G.O. N° 40.418</div>
  </div>

<script src="js/auth-guard.js"></script>
<script src="js/tenant-loader.js"></script>
<script src="js/login.js"></script>
</body>
</html>
