<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#04070d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="20" y="20" width="460" height="460" rx="75" fill="none" stroke="url(#goldGlow)" stroke-width="1.5" stroke-dasharray="12 6"/>
  <g transform="translate(250, 190)" filter="url(#subtleShadow)">
    <path d="M-100,-70 L0,-130 L100,-70 L100,50 L-100,50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-60,-40 L0,-80 L60,-40 L60,50 L-60,50 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="0" y1="-130" x2="0" y2="50" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="0" y="32" font-family="'Outfit', 'Manrope', sans-serif" font-weight="900" font-size="64" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">MS</text>
  </g>
  <g transform="translate(250, 360)">
    <text x="0" y="0" font-family="'Outfit', 'Manrope', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">CENTRO COMERCIAL</text>
    <text x="0" y="42" font-family="'Outfit', 'Manrope', sans-serif" font-weight="800" font-size="38" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">MARIO SÁNCHEZ</text>
    <text x="0" y="75" font-family="'Manrope', sans-serif" font-weight="700" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="6">PUERTO LA CRUZ • VENEZUELA</text>
  </g>
</svg>